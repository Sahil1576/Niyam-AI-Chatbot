<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Niyam AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Newsreader:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <span class="mark"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 22h18M6 18v-7M10 18v-7M14 18v-7M18 18v-7M12 2l8 5H4z"/></svg></span>
      <span class="name">Niyam AI<small>RBI Guidelines Assistant</small></span>
    </div>
    <div class="spacer"></div>
    <div class="status"><i id="dot"></i><span id="statusTxt">Checking server</span></div>
    <button class="ghost" id="theme">Switch theme</button>
  </header>

  <section class="feed" id="feed" aria-live="polite"></section>

  <form class="composer" id="form">
    <textarea id="input" rows="1" placeholder="Ask a question about your documents" aria-label="Your question"></textarea>
    <button id="send" type="submit" aria-label="Send question">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
    </button>
  </form>
  <p class="hint">Niyam AI is an independent assistant based on RBI guidelines. Verify with the official RBI circulars before acting.</p>
</div>
<script src="script.js"></script>
</body>
</html>
