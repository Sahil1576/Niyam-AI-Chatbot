<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Niyam AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Newsreader:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="brand"><span class="mark">नि</span><span>Niyam AI</span></div>
    <button class="new" id="newChat">New chat</button>
    <nav class="history" id="history" aria-label="Chats"></nav>
    <div class="side-foot">
      <div class="status"><i id="dot"></i><span id="statusTxt">Checking server</span></div>
      <label class="api">API URL<input id="apiUrl" spellcheck="false" autocomplete="off"></label>
      <button class="ghost" id="theme">Switch theme</button>
    </div>
  </aside>

  <main class="main">
    <header class="top">
      <button class="ghost menu" id="menu" aria-label="Open chats">Chats</button>
      <h1 id="title">New chat</h1>
      <button class="ghost" id="clear">Delete chat</button>
    </header>

    <section class="feed" id="feed" aria-live="polite"></section>

    <form class="composer" id="form">
      <textarea id="input" rows="1" placeholder="Ask a question about your documents" aria-label="Your question"></textarea>
      <button id="send" type="submit" aria-label="Send question">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
      </button>
    </form>
    <p class="hint">Answers come from your indexed PDFs. Check the sources before relying on them.</p>
  </main>
</div>
<script src="script.js"></script>
</body>
</html>
